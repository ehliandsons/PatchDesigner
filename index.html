<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PatchDesigner</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        font-family: Arial, sans-serif;
        background: #111;
        color: #fff;
        margin: 0;
        padding: 20px;
    }

    h1 {
        color: #E8602B;
        margin-bottom: 10px;
    }

    button {
        background: #E8602B;
        border: none;
        padding: 10px 16px;
        color: white;
        font-size: 14px;
        cursor: pointer;
        border-radius: 4px;
        margin: 4px 4px 4px 0;
    }

    button:hover {
        background: #ff7a42;
    }

    #layout {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
    }

    #left,
    #right {
        flex: 1 1 300px;
        min-width: 280px;
    }

    canvas {
        background: #222;
        border: 1px solid #444;
        width: 100%;
        max-width: 600px;
        height: auto;
    }

    #controls {
        background: #181818;
        padding: 10px;
        border-radius: 6px;
    }

    #controls label {
        display: block;
        font-size: 13px;
        margin-top: 8px;
        margin-bottom: 2px;
    }

    #controls input[type="text"],
    #controls input[type="number"],
    #controls select,
    #controls textarea {
        width: 100%;
        padding: 6px;
        border-radius: 4px;
        border: 1px solid #444;
        background: #111;
        color: #fff;
        font-size: 13px;
    }

    #zones-list {
        margin-top: 10px;
        border-top: 1px solid #333;
        padding-top: 10px;
    }

    .zone-item {
        padding: 6px;
        border-radius: 4px;
        background: #222;
        margin-bottom: 6px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 13px;
    }

    .zone-item span {
        flex: 1;
    }

    .zone-item button {
        padding: 4px 8px;
        font-size: 12px;
    }

    #json-output {
        width: 100%;
        min-height: 120px;
        font-family: monospace;
        font-size: 12px;
        background: #111;
        color: #0f0;
        border-radius: 4px;
        border: 1px solid #333;
        padding: 8px;
        margin-top: 10px;
        white-space: pre;
        overflow-x: auto;
    }

    @media (max-width: 768px) {
        #layout {
            flex-direction: column;
        }
    }
</style>
</head>
<body>

<h1>PatchDesigner</h1>

<div id="layout">
    <div id="left">
        <canvas id="canvas" width="600" height="400"></canvas>
    </div>

    <div id="right">
        <div id="controls">
            <h3 style="margin-top:0;">Text Zone Controls</h3>

            <label>Text</label>
            <input type="text" id="text" value="Sample Text">

            <label>Font family</label>
            <select id="font-family">
                <option value="Arial">Arial</option>
                <option value="Helvetica">Helvetica</option>
                <option value="Impact">Impact</option>
                <option value="Georgia">Georgia</option>
                <option value="Courier New">Courier New</option>
            </select>

            <label>Font size (px)</label>
            <input type="number" id="font-size" value="32" min="8" max="120">

            <label>Color (hex)</label>
            <input type="text" id="color" value="#ffffff">

            <label>Position X</label>
            <input type="number" id="x" value="100">

            <label>Position Y</label>
            <input type="number" id="y" value="100">

            <div style="margin-top:10px;">
                <button id="add-zone">Add text zone</button>
                <button id="update-zone">Update selected</button>
                <button id="delete-zone">Delete selected</button>
            </div>

            <div id="zones-list"></div>

            <h3 style="margin-top:15px;">Config JSON</h3>
            <textarea id="json-output" readonly></textarea>

            <div style="margin-top:10px;">
                <button id="copy-json">Copy JSON</button>
                <button id="load-json">Load JSON from clipboard</button>
            </div>
        </div>
    </div>
</div>

<script>
const BASE_IMAGE_URL = "https://via.placeholder.com/600x400?text=Patch+Base";

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const textInput = document.getElementById("text");
const fontFamilyInput = document.getElementById("font-family");
const fontSizeInput = document.getElementById("font-size");
const colorInput = document.getElementById("color");
const xInput = document.getElementById("x");
const yInput = document.getElementById("y");

const addZoneBtn = document.getElementById("add-zone");
const updateZoneBtn = document.getElementById("update-zone");
const deleteZoneBtn = document.getElementById("delete-zone");

const zonesListEl = document.getElementById("zones-list");
const jsonEl = document.getElementById("json-output");

let baseImage = new Image();
let zones = [];
let selectedZoneIndex = -1;

baseImage.onload = () => render();
baseImage.src = BASE_IMAGE_URL;

function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(baseImage, 0, 0, canvas.width, canvas.height);

    zones.forEach((zone, index) => {
        ctx.font = `${zone.fontSize}px ${zone.fontFamily}`;
        ctx.fillStyle = zone.color;
        ctx.fillText(zone.text, zone.x, zone.y);

        if (index === selectedZoneIndex) {
            ctx.strokeStyle = "#E8602B";
            ctx.lineWidth = 2;
            const metrics = ctx.measureText(zone.text);
            const height = zone.fontSize;
            const width = metrics.width;
            ctx.strokeRect(zone.x, zone.y - height, width, height);
        }
    });

    updateJson();
    renderZonesList();
}

function updateJson() {
    const config = {
        baseImage: baseImage.src,
        textZones: zones
    };
    jsonEl.value = JSON.stringify(config, null, 2);
}

function renderZonesList() {
    zonesListEl.innerHTML = "";
    zones.forEach((zone, index) => {
        const div = document.createElement("div");
        div.className = "zone-item";
        div.dataset.index = index;

        const span = document.createElement("span");
        span.textContent = `${index + 1}: ${zone.text} (${zone.x},${zone.y})`;
        div.appendChild(span);

        const selectBtn = document.createElement("button");
        selectBtn.textContent = "Select";
        selectBtn.onclick = () => {
            selectedZoneIndex = index;
            loadZoneIntoControls(zones[index]);
            render();
        };
        div.appendChild(selectBtn);

        zonesListEl.appendChild(div);
    });
}

function loadZoneIntoControls(zone) {
    textInput.value = zone.text;
    fontFamilyInput.value = zone.fontFamily;
    fontSizeInput.value = zone.fontSize;
    colorInput.value = zone.color;
    xInput.value = zone.x;
    yInput.value = zone.y;
}

addZoneBtn.onclick = () => {
    zones.push({
        text: textInput.value,
        fontFamily: fontFamilyInput.value,
        fontSize: parseInt(fontSizeInput.value),
        color: colorInput.value,
        x: parseInt(xInput.value),
        y: parseInt(yInput.value)
    });
    selectedZoneIndex = zones.length - 1;
    render();
};

updateZoneBtn.onclick = () => {
    if (selectedZoneIndex < 0) return;
    const zone = zones[selectedZoneIndex];
    zone.text = textInput.value;
    zone.fontFamily = fontFamilyInput.value;
    zone.fontSize = parseInt(fontSizeInput.value);
    zone.color = colorInput.value;
    zone.x = parseInt(xInput.value);
    zone.y = parseInt(yInput.value);
    render();
};

deleteZoneBtn.onclick = () => {
    if (selectedZoneIndex < 0) return;
    zones.splice(selectedZoneIndex, 1);
    selectedZoneIndex = -1;
    render();
};

canvas.onclick = (evt) => {
    const rect = canvas.getBoundingClientRect();
    const x = evt.clientX - rect.left;
    const y = evt.clientY - rect.top;

    let clickedIndex = -1;
    for (let i = zones.length - 1; i >= 0; i--) {
        const zone = zones[i];
        ctx.font = `${zone.fontSize}px ${zone.fontFamily}`;
        const metrics = ctx.measureText(zone.text);
        const height = zone.fontSize;
        const width = metrics.width;
        const left = zone.x;
        const top = zone.y - height;
        const right = left + width;
        const bottom = top + height;
        if (x >= left && x <= right && y >= top && y <= bottom) {
            clickedIndex = i;
            break;
        }
    }

    if (clickedIndex !== -1) {
        selectedZoneIndex = clickedIndex;
        loadZoneIntoControls(zones[clickedIndex]);
        render();
    }
};

document.getElementById("copy-json").onclick = () => {
    navigator.clipboard.writeText(jsonEl.value);
    alert("JSON copied.");
};

document.getElementById("load-json").onclick = async () => {
    try {
        const text = await navigator.clipboard.readText();
        const parsed = JSON.parse(text);
        baseImage.src = parsed.baseImage;
        zones = parsed.textZones;
        selectedZoneIndex = -1;
        render();
    } catch {
        alert("Invalid JSON.");
    }
};
</script>

</body>
</html>
